# Agent Registry
# Platform discovers agents via HTTP by fetching their Agent Cards.
# Each agent is an independent A2A server.

agents:
  - id: ava
    name: AVA
    url: http://localhost:4000
    description: Advanced Virtual Assistant - Central routing agent that directs customer requests to specialized agents

  - id: charge-verification
    name: Charge Verification
    url: http://localhost:4001
    description: Investigates unrecognized or suspicious charges and handles disputes

  - id: card-replacement
    name: Card Replacement
    url: http://localhost:4002
    description: Handles complete card replacement workflow including fraud cases
